name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Docs and screenshots do not change the build, so they skip the deploy.
    paths-ignore:
      - 'screenshots/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build for the /ScanLu/ subpath
        run: npm run build:pages
        env:
          # Baked into the bundle, so the QR code and print card point at the
          # deployed site instead of localhost. Safe to commit: this is a URL.
          VITE_PUBLIC_APP_URL: https://zylioth.github.io/ScanLu

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
