name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Docs and screenshots do not change the build, so they skip the deploy.
    paths-ignore:
      - 'screenshots/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build for the /ScanLu/ subpath
        run: npm run build:pages
        env:
          # Baked into the bundle at build time, so they have to be here rather
          # than in a local .env file that never reaches the runner.
          #
          # All of these are public on purpose. VITE_* values end up inside the
          # JavaScript every guest downloads, and the publishable key is built
          # for exactly that. The RLS policies in
          # supabase/migrations/0001_init.sql are what protect the data. Never
          # put the service_role key in this file.
          #
          # Emptying VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY silently drops
          # the site back to the browser demo backend, which looks like a broken
          # deployment rather than a config mistake.
          VITE_PUBLIC_APP_URL: https://zylioth.github.io/ScanLu
          VITE_SUPABASE_URL: https://qbafknjgqcdhheziregq.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_3slrqglCmJMMjcFqnirQKA_6j9xgie4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
